services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    volumes:
      - nginx_cache:/var/cache/nginx

volumes:
  nginx_cache:
